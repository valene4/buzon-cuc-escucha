<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón CUC Escucha</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1> Buzón CUC Escucha</h1>
            <p>Tu voz es importante. Comparte tus ideas y sugerencias para mejorar la Facultad de Ingeniería.</p>
        </div>
    </header>

    <main>
        <section class="form-section">
            <div class="container">
                <h2>Formulario de Sugerencias</h2>
                <form id="sugerenciaForm">
                    <div class="campo">
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
                    </div>

                    <div class="campo">
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@estudiante.edu.co" required>
                    </div>

                    <div class="campo">
                        <label for="programa">Programa Académico:</label>
                        <input type="text" id="programa" name="programa" placeholder="Ej: Ingeniería de Sistemas" required>
                    </div>
                    
                    <div class="campo">
                        <label for="semestre">Semestre:</label>
                        <input type="number" id="semestre" name="semestre" placeholder="Ej: 4" min="1" max="10" required>
                    </div>
                    
                    <div class="campo">
                        <label for="categoria">Categoría:</label>
                        <select id="categoria" name="categoria" required>
                            <option value="">Selecciona una categoría</option>
                            <option value="bienestar">Bienestar Universitario</option>
                            <option value="servicios">Servicios</option>
                            <option value="clases">Clases y Docentes</option>
                            <option value="inclusion">Inclusión</option>
                            <option value="espacios">Espacios Físicos</option>
                            <option value="procesos">Procesos Académicos</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="mensaje">Tu sugerencia:</label>
                        <textarea id="mensaje" name="mensaje" rows="5" placeholder="Cuéntanos tu idea o sugerencia..." required></textarea>
                    </div>

                    <button type="submit">Enviar Sugerencia</button>
                </form>
                <div id="mensajeExito" style="display: none; margin-top: 20px; padding: 15px; background-color: #d4edda; color: #155724; border-radius: 5px;">
                     ¡Gracias! Tu sugerencia ha sido enviada con éxito.
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Facultad de Ingeniería - Buzón CUC Escucha</p>
            <p>© 2026 - Todos los derechos reservados</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
